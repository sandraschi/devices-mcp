name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach assets to (e.g. v1.21.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  mcpb:
    name: MCPB and Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Verify Python package
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Install MCPB CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Validate and build MCPB package
        run: |
          mcpb validate manifest.json
          mcpb pack . dist/devices-mcp.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: release-python-mcpb
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb

  native-windows:
    name: Tauri desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: tauri-apps/setup-tauri@v2

      - name: Build Tauri and stage tauri.exe
        shell: pwsh
        run: pwsh -NoLogo -File native/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: release-tauri
          path: |
            dist/tauri.exe
            native/target/release/bundle/nsis/*-setup.exe

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [mcpb, native-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-python-mcpb
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-tauri
          path: dist/

      - name: List release assets
        run: ls -la dist/

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: github.event_name == 'push' && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
